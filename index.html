<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Is All You Need — Transformer 1팀</title>
<style>
  :root {
    --bg: #000;
    --stage: #07070a;
    --fg: #f2f2f2;
    --muted: #9a9aa2;
    --line: #26262c;
    --q: #FFD84D;   /* Query  */
    --k: #4DA3FF;   /* Key    */
    --v: #5BD17A;   /* Value  */
    --a: #FF9A3C;   /* Attention weight */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font-family: "Pretendard", "Pretendard Variable", "Malgun Gothic", "맑은 고딕",
                 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: grid; place-items: center;
  }
  /* 16:9 스테이지 — 모든 크기는 cqw(스테이지 폭의 1%) 기준 */
  #stage {
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: var(--stage);
    position: relative;
    container-type: size;
    overflow: hidden;
    touch-action: none;
  }
  .slide { position: absolute; inset: 0; display: none; padding: 2.2cqw 3cqw 3.6cqw; }
  .slide.active { display: flex; flex-direction: column; }
  .slide h1 {
    margin: 0 0 1.4cqw; font-size: 2.5cqw; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: baseline; gap: 1.2cqw;
  }
  .slide h1 .no { color: var(--a); font-size: 1.6cqw; font-variant-numeric: tabular-nums; font-weight: 600; }
  /* 8단계 파이프라인 위치 표시 */
  .slide h1 .steps { margin-left: auto; display: flex; gap: 0.35cqw; align-self: center; }
  .slide h1 .steps i {
    font-style: normal; font-size: 0.85cqw; font-weight: 600; width: 1.5cqw; height: 1.5cqw;
    display: grid; place-items: center; border-radius: 50%; border: 1px solid #3a3a42; color: #55555c;
  }
  .slide h1 .steps i.on { background: var(--a); border-color: var(--a); color: #000; }
  .slide h1 .steps i.done { border-color: #6a5a48; color: #8a7a68; }
  .body { flex: 1; display: grid; grid-template-columns: 66cqw 1fr; gap: 2.2cqw; min-height: 0; }
  .vid {
    position: relative; width: 66cqw; aspect-ratio: 16 / 9; background: #000;
    border: 1px solid var(--line); border-radius: 0.6cqw; overflow: hidden; align-self: start;
  }
  .vid video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  .vid .missing {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    color: var(--muted); font-size: 1.3cqw; line-height: 1.6; padding: 2cqw;
  }
  .vid.error .missing { display: grid; }
  .vid.error video { visibility: hidden; }
  ul.pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.1cqw; }
  ul.pts li {
    font-size: 1.32cqw; line-height: 1.5; color: var(--fg);
    padding-left: 1.4cqw; position: relative; word-break: keep-all;
  }
  ul.pts li::before {
    content: ""; position: absolute; left: 0; top: 0.6cqw; width: 0.55cqw; height: 0.55cqw;
    border-radius: 50%; background: var(--a);
  }
  .q { color: var(--q); } .k { color: var(--k); } .v { color: var(--v); } .a { color: var(--a); }
  /* 표지 / 정리 등 bullet 없는 슬라이드 */
  .slide.full { padding: 1.6cqw 3cqw 3.6cqw; }
  .slide.full h1 { display: none; }
  .slide.full .body { grid-template-columns: 1fr; place-items: center; }
  .slide.full .vid { width: 84cqw; }
  .slide.full ul.pts { display: none; }

  /* 하단 진행 바 + 페이지 */
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 0.35cqw; background: var(--line); }
  #bar > div { height: 100%; width: 0; background: var(--a); transition: width .25s ease; }
  #page {
    position: absolute; right: 2cqw; bottom: 1cqw; font-size: 1.05cqw; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #hint { position: absolute; left: 3cqw; bottom: 1cqw; font-size: 0.95cqw; color: #55555c; }
  kbd {
    font-family: inherit; border: 1px solid #3a3a42; border-bottom-width: 2px; border-radius: 0.3cqw;
    padding: 0 0.35cqw; font-size: 0.85cqw; color: #8a8a92;
  }

  /* 발표자 노트 */
  #notes {
    position: absolute; left: 0; right: 0; bottom: 3.2cqw; max-height: 34%;
    background: rgba(14, 14, 18, 0.96); border-top: 1px solid #3a3a42;
    padding: 1.4cqw 3cqw 1.6cqw; font-size: 1.35cqw; line-height: 1.65; color: #e6e6ea;
    transform: translateY(120%); opacity: 0; transition: transform .22s ease, opacity .22s ease;
    overflow-y: auto; word-break: keep-all; pointer-events: none;
  }
  #notes.open { transform: none; opacity: 1; pointer-events: auto; }
  #notes .lbl { color: var(--a); font-size: 1cqw; font-weight: 700; letter-spacing: .08em; margin-bottom: .5cqw; }
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="notes"><div class="lbl">SPEAKER NOTES · S</div><div id="notes-text"></div></div>
  <div id="hint"><kbd>←</kbd> <kbd>→</kbd> <kbd>Space</kbd> 이동 · <kbd>S</kbd> 노트 · <kbd>R</kbd> 다시 재생 · <kbd>F</kbd> 전체화면</div>
  <div id="page"></div>
  <div id="bar"><div></div></div>
</div>

<script>
const SLIDES = [
  { t: "Attention Is All You Need", full: true, b: [],
    n: "안녕하세요, Transformer 1팀입니다. 오늘 리뷰할 논문은 2017년 NeurIPS에 발표된 'Attention Is All You Need'입니다. 'Allen walks dog'라는 문장 하나가 입력되어 출력이 나올 때까지 거치는 8단계를 순서대로 따라가면서, 각 단계가 왜 그렇게 설계됐는지를 짚어 보겠습니다." },
  { t: "배경: RNN / seq2seq 의 한계",
    b: ["RNN은 토큰을 한 step씩 순차 처리 → 병렬화 불가",
        "먼 토큰 사이 정보는 긴 경로를 거쳐야 함 → 장거리 의존성 학습이 어려움",
        "Transformer: recurrence·convolution 없이 <span class='a'>attention만</span> 사용",
        "모든 토큰 쌍을 한 번에 연결 (경로 길이 O(1))"],
    n: "기존 seq2seq 모델은 이전 hidden state가 있어야 다음 계산을 할 수 있어서, 문장 길이만큼 순차적으로 돌아야 했습니다. 그래서 GPU 병렬화가 어렵고, 첫 단어와 마지막 단어 사이 정보는 여러 단계를 거쳐야 전달됩니다. Transformer는 recurrence를 완전히 버리고 attention으로 모든 토큰을 한 번에 연결합니다." },
  { t: "전체 구조",
    b: ["Encoder · Decoder 모두 N = 6 층 스택",
        "입력 = Embedding + Positional Encoding",
        "Encoder 층: Multi-Head Attention → Add&Norm → FFN → Add&Norm",
        "Decoder 층: Masked MHA → Encoder-Decoder MHA → FFN (각각 Add&Norm)",
        "모든 sublayer 출력 차원 d<sub>model</sub> = 512"],
    n: "논문 Figure 1의 구조입니다. 입력 토큰은 임베딩에 위치 인코딩을 더해 들어가고, 인코더는 multi-head attention과 feed-forward 두 sublayer를 가진 층을 6번 쌓습니다. 디코더는 여기에 인코더 출력을 참조하는 attention이 하나 더 있어서 sublayer가 세 개입니다. 각 sublayer 뒤에는 residual 연결과 layer normalization이 붙습니다." },
  { t: "로드맵: 문장 → 출력까지 8단계",
    b: ["① Tokenize + Embedding → ② + Positional Encoding",
        "③ Multi-Head Self-Attention → ④ Add &amp; Norm",
        "⑤ FFN (512→2048→512) → ⑥ Add &amp; Norm",
        "③~⑥ = Encoder Block, ⑦ 6층 쌓기 → ⑧ Linear + Softmax"],
    n: "오늘 발표의 지도입니다. 문장은 토큰으로 쪼개져 벡터가 되고, 위치 정보를 더한 뒤, 어텐션으로 문맥을 섞고, residual과 LayerNorm으로 다듬고, FFN으로 비선형 가공을 하고, 다시 Add & Norm을 거칩니다. 3번부터 6번이 인코더 블록 하나이고 이걸 6번 쌓은 뒤, 마지막에 Linear와 Softmax로 다음 토큰 확률을 냅니다. 발표도 이 순서 그대로 진행합니다." },
  { st: 1, t: "Tokenize + Embedding",
    b: ["\"Allen walks dog\" → [Allen, walks, dog] (실제: BPE 서브워드, 어휘 ≈ 37,000)",
        "각 토큰 → 학습되는 임베딩 행렬 E 의 한 행 → d<sub>model</sub> = 512 차원",
        "임베딩 × √d<sub>model</sub> · 입력/출력 임베딩과 pre-softmax Linear 가 가중치 공유",
        "임베딩은 <span class='a'>순서</span>도 <span class='q'>문맥</span>도 모름 → ②, ③ 이 필요"],
    n: "1단계는 토큰화와 임베딩입니다. 문장을 토큰으로 쪼개는데, 논문은 실제로 단어가 아니라 BPE 서브워드를 쓰고 영어-독일어 어휘는 약 3만 7천 개입니다. 각 토큰은 학습되는 임베딩 행렬의 한 행을 가져와 512차원 벡터가 되고, 논문은 여기에 루트 d_model을 곱합니다. 또 입력 임베딩, 출력 임베딩, 마지막 softmax 직전 Linear가 같은 가중치 행렬을 공유합니다. 중요한 건 이 벡터가 단어마다 고정이라 순서도 문맥도 모른다는 점이고, 그래서 2단계와 3단계가 필요합니다." },
  { st: 2, t: "Positional Encoding ① 왜 순서 정보가 필요한가",
    b: ["\"Allen walks dog\" 와 \"dog walks Allen\" = 같은 벡터 집합",
        "Self-attention 은 순서 무관: Attention(PX) = P·Attention(X)",
        "→ 순서를 바꿔도 각 단어의 출력 표현은 동일 (RNN·CNN 과 달리 순서 개념이 없음)",
        "해결: x<sub>pos</sub> = Embedding(token) + <span class='a'>PE(pos)</span> — 같은 512 차원이라 더하기"],
    n: "2단계 위치 인코딩입니다. 앨런이 개를 산책시키는 것과 개가 앨런을 산책시키는 것은 뜻이 완전히 다르지만, 임베딩만 보면 두 문장은 똑같은 벡터 세 개의 집합입니다. 어텐션은 순서를 섞으면 출력도 똑같이 섞일 뿐이라서, Allen의 표현은 두 문장에서 완전히 같아집니다. 그래서 위치마다 다른 벡터를 임베딩에 더해 주는데, 논문은 PE가 d_model과 같은 차원이라 그냥 합할 수 있다고 설명합니다. 이어 붙이면 차원이 늘어나 뒤의 모든 행렬이 커지기 때문에 더하기가 경제적입니다." },
  { st: 2, t: "Positional Encoding ② 주기 함수인데 어떻게 고유한가",
    b: ["PE<sub>(pos,2i)</sub> = sin(pos·ω<sub>i</sub>), PE<sub>(pos,2i+1)</sub> = cos(pos·ω<sub>i</sub>), ω<sub>i</sub> = 1/10000<sup>2i/d<sub>model</sub></sup>",
        "한 주파수만 보면 pos 0 ≈ pos 44 (44 ≈ 2π × 7) → 사실상 충돌",
        "느린 주파수(i=64)를 함께 보면 (0.00, 1.00) vs (−0.95, −0.31) → 분리",
        "이진수 비유: 하위 비트는 빠르게, 상위 비트는 느리게 → <span class='a'>조합</span>이 위치를 유일하게 결정",
        "256 개 주파수 × (sin, cos) → 결정론적 · 위치마다 고유 · 파라미터 0개"],
    n: "여기서 자연스러운 의문이 생깁니다. sin과 cos는 반복되는 함수인데 어떻게 위치마다 고유한 값을 줄 수 있을까요? 실제로 가장 빠른 주파수 하나만 보면 0번 위치와 44번 위치는 거의 같은 값이 됩니다. 44가 2파이의 약 7배라서 일곱 바퀴를 돌아 제자리에 오기 때문입니다. 답은 다중 주파수의 조합에 있습니다. 차원마다 주파수가 다르고, 느린 파동은 44칸 동안 한 바퀴도 못 돌기 때문에 두 위치를 확실히 갈라놓습니다. 이진수에서 맨 아래 비트는 매번 뒤집히고 위 비트는 천천히 바뀌어 그 조합이 숫자를 유일하게 정하는 것과 같은 원리이고, sin과 cos는 그 연속값 버전이라 위치 간 거리도 부드럽게 표현됩니다. 수식으로 정해지니 학습 파라미터 없이 항상 같은 값이 나오는 결정론적 인코딩입니다." },
  { st: 2, t: "Positional Encoding ③ 왜 10000, 그리고 상대 위치",
    b: ["파장 = 등비수열 2π → 10000·2π (논문 원문) · 짧은 파장: 인접 구분, 긴 파장: 긴 문장에서도 안 겹침",
        "10000 은 경험적 선택 — 논문에 값 비교 실험은 없음 (작으면 반복, 크면 고차원이 거의 상수)",
        "PE(pos+k) = R(k)·PE(pos): 고정 오프셋 k 는 pos 와 무관한 <span class='a'>회전(선형 변환)</span>",
        "→ \"몇 칸 떨어졌나\" 를 쉽게 학습하리라는 가설 (논문의 선택 이유)",
        "학습형 위치 임베딩: 25.7 vs sinusoid 25.8 (Table 3 E, dev BLEU) → 거의 동일, 외삽 가능성 때문에 sinusoid"],
    n: "그럼 왜 하필 10000일까요? 주파수 공식 때문에 파장이 2파이에서 10000 곱하기 2파이까지 등비수열로 퍼집니다. 가장 짧은 파장은 6토큰 정도라 바로 옆 단어를 구분하고, 가장 긴 파장은 약 6만 토큰이라 아주 긴 문장에서도 한 바퀴를 다 돌지 않습니다. 이 값이 너무 작으면 느린 파동도 금방 반복되고, 너무 크면 상위 차원들이 거의 변하지 않는 상수가 되어 낭비됩니다. 다만 논문은 10000을 다른 값과 비교한 실험은 하지 않았으니, 경험적인 선택으로 보는 게 정확합니다. 논문이 sinusoid를 고른 이유는 따로 있는데, 위치를 k칸 옮기는 것이 sin·cos 쌍을 각도 ωk만큼 회전시키는 고정 행렬이라서, 상대 위치를 선형으로 쉽게 학습할 수 있으리라는 가설입니다. 학습형 위치 임베딩과 성능은 거의 같았고, 학습 때보다 긴 문장으로 외삽할 수 있을 가능성 때문에 sinusoid를 택했다고 밝힙니다." },
  { st: 3, t: "Self-Attention · 왜 Attention 인가",
    b: ["\"The animal didn't cross the street because <span class='q'>it</span> was tired.\"",
        "it 이 가리키는 대상 = <span class='a'>animal</span>",
        "it 의 새 표현 = 다른 토큰들의 가중합",
        "가중치(선 굵기)가 클수록 더 많이 참고 · 값은 예시"],
    n: "이 문장에서 it은 street가 아니라 animal을 가리킵니다. Attention은 it의 표현을 만들 때 문장의 모든 단어를 보되, animal에 큰 가중치를 주는 방식으로 이 문제를 풉니다. 화면의 선 굵기가 그 가중치이고, 값은 설명을 위한 예시입니다." },
  { st: 3, t: "Weighted Sum",
    b: ["Output = <span class='a'>α₁</span><span class='v'>V₁</span> + … + <span class='a'>αₘ</span><span class='v'>Vₘ</span>",
        "αᵢ ≥ 0,  Σ αᵢ = 1",
        "큰 α 를 받은 Value 가 출력에 더 많이 반영",
        "핵심 질문: α 를 어떻게 정할까?"],
    n: "Attention의 출력은 결국 Value 벡터들의 가중합입니다. 가중치 α는 0 이상이고 합이 1이라서, 어떤 위치를 얼마나 참고할지의 비율로 볼 수 있습니다. 이제 남은 질문은 이 α를 어떻게 정하느냐입니다." },
  { st: 3, t: "Average vs Hard Selection",
    b: ["Average: αᵢ = 1/m (0.25 × 4) → 모두 동일, 구분 없음",
        "Hard: one-hot (0, 1, 0) → 하나만 선택, 나머지 버림",
        "두 극단 사이 어딘가가 필요하다"],
    n: "가장 단순한 방법은 모두에게 똑같이 1/m을 주는 평균인데, 그러면 무엇이 중요한지 전혀 구분하지 못합니다. 반대 극단은 하나만 고르는 hard selection으로, 나머지 정보를 모두 버립니다. 우리가 원하는 것은 이 두 극단 사이의 무언가입니다." },
  { st: 3, t: "Soft Selection",
    b: ["(0.15, 0.70, 0.15): 가장 관련된 곳에 집중 + 나머지도 일부 반영",
        "정보가 여러 위치에 분산된다",
        "softmax → 어디서나 미분 가능 → 경사하강으로 바로 학습",
        "Hard(argmax)는 미분 불가 → 학습이 까다로움 (REINFORCE 등으로 불가능은 아님)"],
    n: "Soft selection은 가장 관련 있는 위치에 큰 비중을 주면서도 다른 위치의 정보도 조금씩 섞습니다. 무엇보다 softmax로 만든 가중치는 미분 가능해서 역전파로 바로 학습할 수 있습니다. Hard selection은 argmax 때문에 기울기가 0이라 학습이 까다롭지만, 강화학습 방식으로 학습하는 연구도 있어 불가능한 것은 아닙니다." },
  { st: 3, t: "Query · Key · Value",
    b: ["<span class='q'>Query</span> = 검색어 (무엇을 찾나)",
        "<span class='k'>Key</span> = 색인 (무엇과 매칭되나)",
        "<span class='v'>Value</span> = 실제 문서 (가져올 내용)",
        "<span class='q'>Q</span> = XW<sup>Q</sup>, <span class='k'>K</span> = XW<sup>K</sup>, <span class='v'>V</span> = XW<sup>V</sup> — 같은 X, 다른 투영"],
    n: "가중치를 정하기 위해 검색 시스템 비유를 씁니다. Query는 검색어, Key는 문서의 색인, Value는 실제 내용이고, Query와 Key가 잘 맞을수록 그 Value를 많이 가져옵니다. self-attention에서는 같은 입력 X에 서로 다른 학습 행렬 세 개를 곱해 Q, K, V를 만듭니다." },
  { st: 3, t: "Dot Product Score",
    b: ["score(<span class='q'>q</span>, <span class='k'>k</span>) = q · k = Σ qᵢkᵢ = |q||k| cos θ",
        "방향이 비슷할수록(θ ↓) score ↑",
        "추가 파라미터 없이 행렬곱 한 번 → 빠르고 메모리 효율적"],
    n: "Query와 Key의 유사도는 내적으로 잽니다. 내적은 두 벡터 크기와 사이각 코사인의 곱이라서, 방향이 비슷할수록 점수가 커집니다. 논문은 additive attention 대신 이 dot-product를 써서, 최적화된 행렬곱으로 빠르게 계산합니다." },
  { st: 3, t: "Scaling: ÷ √d<sub>k</sub>",
    b: ["q, k 성분이 평균 0 · 분산 1 이면 Var(q·k) = d<sub>k</sub>",
        "d<sub>k</sub> ↑ → score 크기 ↑ → softmax 포화 (거의 one-hot)",
        "포화 영역에서는 기울기 ≈ 0",
        "÷ √d<sub>k</sub> 로 분산을 1 수준으로 → 부드러운 분포 유지"],
    n: "d_k가 커지면 내적값의 분산이 d_k에 비례해 커집니다. 그러면 softmax가 거의 one-hot이 되어 기울기가 극히 작아집니다. 그래서 루트 d_k로 나눠 분산을 1 수준으로 맞추는데, 이것이 scaled dot-product의 의미입니다. 화면 예시는 d_k가 64라서 8로 나눈 경우입니다." },
  { st: 3, t: "Scaled Dot-Product Attention",
    b: ["Attention(<span class='q'>Q</span>,<span class='k'>K</span>,<span class='v'>V</span>) = softmax(<span class='q'>Q</span><span class='k'>K</span>ᵀ / √d<sub>k</sub>) <span class='v'>V</span>",
        "QKᵀ: 모든 Query–Key 쌍의 score (n × n)",
        "softmax: 행마다 합이 1인 <span class='a'>가중치</span>",
        "Decoder: 미래 위치를 −∞ 로 masking → softmax 후 0"],
    n: "지금까지를 합치면 이 한 줄의 수식이 됩니다. QK transpose로 모든 쌍의 점수를 한꺼번에 구하고, 루트 d_k로 나눈 뒤 행 단위 softmax로 가중치를 만들어 V와 곱합니다. 디코더에서는 아직 생성되지 않은 미래 단어를 보면 안 되므로, softmax 전에 해당 위치를 마이너스 무한대로 바꿔 가중치를 0으로 만듭니다." },
  { st: 3, t: "하나의 Head 로 충분할까?",
    b: ["Query 하나당 가중치 분포는 하나뿐",
        "it → '누구'(animal) 와 '상태'(tired) 를 동시에 봐야 함",
        "한 분포로 둘 다 보면 → 양쪽 모두 희석",
        "→ 여러 관점을 병렬로: <span class='a'>Multi-Head</span>"],
    n: "그런데 head가 하나면 Query 하나에 softmax 분포도 하나뿐입니다. it을 이해하려면 가리키는 대상인 animal과 상태인 tired를 모두 봐야 하는데, 한 분포로 둘 다 잡으려 하면 가중치가 나뉘어 둘 다 흐려집니다. 논문은 이를 single head에서는 averaging이 표현을 방해한다고 설명하고, 이것이 multi-head의 동기입니다." },
  { st: 3, t: "Multi-Head 직관",
    b: ["Head 1: animal <span class='a'>0.80</span> / street 0.10 / tired 0.10",
        "Head 2: animal 0.10 / street 0.10 / tired <span class='a'>0.80</span>",
        "head 마다 독립적인 softmax → 서로 다른 관계를 동시에 포착",
        "값은 설명용 예시"],
    n: "head를 둘로 나누면 Head 1은 지시 대상인 animal에, Head 2는 상태인 tired에 각각 집중할 수 있습니다. 논문도 multi-head가 서로 다른 표현 부분공간의 정보를 동시에 참조하게 해 준다고 설명합니다. 다만 실제 head들이 이렇게 깔끔하게 역할을 나누는지는 뒤의 후속 연구에서 다시 보겠습니다." },
  { st: 3, t: "Multi-Head 수식",
    b: ["headᵢ = Attention(<span class='q'>QWᵢ<sup>Q</sup></span>, <span class='k'>KWᵢ<sup>K</sup></span>, <span class='v'>VWᵢ<sup>V</sup></span>)",
        "MultiHead(Q,K,V) = Concat(head₁, …, head<sub>h</sub>) W<sup>O</sup>",
        "Concat · W<sup>O</sup> = Σᵢ Hᵢ Wᵢ<sup>O</sup> (블록 행렬곱)",
        "W<sup>O</sup> 가 head 별 출력을 섞어 하나의 표현으로"],
    n: "각 head는 자기만의 투영 행렬로 Q, K, V를 만든 뒤 scaled dot-product attention을 수행합니다. 그 결과를 이어 붙이고 W^O를 곱하는데, 블록 행렬곱으로 보면 각 head 출력에 W^O의 해당 행 블록을 곱해서 더한 것과 같습니다. 즉 W^O는 head들이 본 정보를 섞어 주는 역할입니다." },
  { st: 3, t: "차원 흐름 (n = 4, d<sub>model</sub> = 512, h = 8)",
    b: ["X: 4×512 → head 별 <span class='q'>Q</span>/<span class='k'>K</span>/<span class='v'>V</span>: 4×64",
        "QKᵀ: 4×4 → head 출력: 4×64",
        "8개 concat: 4×512 → × W<sup>O</sup> (512×512) → 4×512",
        "d<sub>k</sub> = d<sub>v</sub> = d<sub>model</sub>/h = 64 → 총 연산량 ≈ single-head"],
    n: "토큰 4개, d_model 512, head 8개를 예로 차원을 따라가 보겠습니다. 각 head는 64차원으로 투영해 4×4 attention 행렬을 만들고 4×64 출력을 냅니다. 8개를 이어 붙이면 다시 512가 되고, W^O를 지나도 4×512가 유지됩니다. head별 차원을 줄였기 때문에 head 수를 늘려도 전체 연산량은 single-head와 비슷합니다." },
  { st: 3, t: "실험: Head 수 비교 (Table 3 A)",
    b: ["h=1: 24.9 · h=4: 25.5 · h=8: <span class='a'>25.8</span> · h=16: <span class='a'>25.8</span> · h=32: 25.4",
        "EN-DE dev set (newstest2013) BLEU, 연산량 고정",
        "single-head 는 최고 대비 −0.9, 너무 많아도 하락",
        "후속: Voita et al. 2019 · Michel et al. 2019 — 상당수 head 는 pruning 가능"],
    n: "논문 Table 3의 (A) 행은 연산량을 고정한 채 head 수만 바꾼 실험입니다. head가 하나일 때는 최고 설정보다 0.9 BLEU 낮고, 8과 16에서 가장 좋으며, 32에서는 다시 떨어집니다. 이후 Voita와 Michel의 연구는 학습된 모델에서 상당수 head를 제거해도 성능이 크게 떨어지지 않는다는 것을 보였습니다. 참고로 이 값은 test가 아니라 dev set 점수입니다." },
  { st: 4, t: "Add &amp; Norm ① Residual Connection",
    b: ["출력 = LayerNorm( x + Dropout(Sublayer(x)) ), P<sub>drop</sub> = 0.1 (base)",
        "정보 보존: sublayer 는 원래 x 위에 얹을 <span class='q'>수정분 Δ</span> 만 학습 → 단어 원래 정보 유지",
        "기울기 고속도로: ∂(x + F(x))/∂x = <span class='a'>I</span> + ∂F/∂x",
        "항등 경로 I 덕분에 층을 깊게 쌓아도 기울기가 곱해져 소멸하지 않음",
        "residual 을 위해 모든 sublayer · 임베딩 출력 차원을 512 로 통일"],
    n: "3단계 어텐션이 끝나면 4단계 첫 번째 Add & Norm입니다. 어텐션 결과에 어텐션 입력 x를 그대로 더하는 것이 residual 연결인데, 이렇게 하면 어텐션은 x를 통째로 다시 만드는 대신 문맥에서 얻은 수정분만 학습하면 되고, 원래 단어 정보는 지름길로 그대로 보존됩니다. 역전파에서도 x 더하기 F(x)를 미분하면 항등행렬 I가 남기 때문에, 층을 6개, 12개 쌓아도 기울기가 계속 곱해져 사라지는 일 없이 아래층까지 전달됩니다. 논문은 이 덧셈을 위해 모든 sublayer와 임베딩의 출력 차원을 512로 맞췄고, 더하기 전에 sublayer 출력에 dropout 0.1을 적용합니다." },
  { st: 4, t: "Add &amp; Norm ① Layer Normalization",
    b: ["LN(x) = γ ⊙ (x − μ) / √(σ² + ε) + β",
        "μ, σ: <span class='a'>토큰 하나</span>의 512 개 차원 값으로 계산 → 평균 0 · 분산 1",
        "γ, β (학습): 필요하면 스케일·위치를 다시 조정",
        "BatchNorm 과 달리 배치 크기·문장 길이와 무관 → 가변 길이 시퀀스에 적합",
        "효과: 층을 거듭해도 값 크기가 폭주·소멸하지 않아 학습 안정"],
    n: "더한 결과에는 Layer Normalization을 적용합니다. 토큰 하나의 512개 값에 대해 평균과 표준편차를 구해서 평균 0, 분산 1로 맞추고, 학습되는 γ와 β로 필요한 만큼 스케일과 위치를 되돌립니다. BatchNorm은 한 차원을 배치 전체에 걸쳐 정규화하기 때문에 배치 크기나 길이가 제각각인 문장에 불편한데, LayerNorm은 토큰 하나 안에서 끝나므로 그런 의존성이 없습니다. residual로 값을 계속 더하면 크기가 점점 커질 수 있는데, 매번 LayerNorm으로 다듬어 주니 깊게 쌓아도 학습이 안정적입니다." },
  { st: 5, t: "FFN ① 넓히고 → 거르고 → 압축",
    b: ["FFN(x) = max(0, xW₁ + b₁) W₂ + b₂",
        "① W₁: 512 → <span class='a'>d<sub>ff</sub> = 2048</span> (4배) — 특징을 잘게 펼칠 공간 확보",
        "② ReLU: 음수 노드는 0 으로 꺼짐 → 이번 입력에 반응하는 노드만 살아남음",
        "③ W₂: 2048 → 512 로 다시 압축해 residual 에 더함",
        "Position-wise: 각 토큰에 같은 W₁·W₂ 를 독립 적용 (커널 1 conv), 층마다 파라미터는 다름"],
    n: "5단계 FFN입니다. 512차원 벡터가 첫 번째 선형층 W1을 만나 2048차원, 즉 4배로 넓어집니다. 공간이 넓어지면 단어 속에 숨은 특징들을 잘게 나눠 담을 수 있습니다. 그다음 ReLU가 음수인 노드를 0으로 꺼 버려서, 이번 입력에 반응하는 노드만 살아남습니다. 마지막으로 W2가 다시 512차원으로 압축해 원래 벡터에 더할 수 있게 만듭니다. 어텐션이 토큰끼리 정보를 섞는 단계라면, FFN은 토큰마다 독립적으로 같은 가중치를 적용해 각 토큰 내부를 가공하는 단계입니다." },
  { st: 5, t: "FFN ② 비선형성은 어디서 오는가",
    b: ["활성화 없으면 W₂(W₁x) = (W₂W₁)x → 512×512 선형변환 하나와 같음 (넓힌 의미 없음)",
        "ReLU 가 있으면 FFN(x) = W₂·<span class='a'>D(x)</span>·(W₁x + b₁), D(x) = 켜진 노드 마스크",
        "입력마다 켜지는 노드 조합 D(x) 가 달라짐 → 입력 영역마다 다른 선형함수",
        "= 조각별 선형(piecewise linear) → 꺾임 2048 개를 조합해 복잡한 곡선을 근사",
        "논문은 ReLU · 이후 BERT/GPT 는 매끄러운 GELU 를 주로 사용"],
    n: "그럼 넓혔다 줄이는 것만으로 어떻게 비선형성이 생길까요? 활성화 함수가 없다면 W2 곱하기 W1은 그냥 행렬 하나라서, 아무리 넓혀도 512에서 512로 가는 선형변환 하나와 똑같습니다. 핵심은 ReLU입니다. ReLU는 어떤 노드를 켜고 끌지를 입력이 스스로 정하게 만듭니다. walks가 들어오면 켜지는 노드 조합과 dog가 들어오면 켜지는 조합이 다르고, 조합마다 서로 다른 선형함수가 적용되니 전체로 보면 조각조각 꺾인 비선형 함수가 됩니다. 2048개의 노드는 2048개의 꺾임이라서, 그래프처럼 이 꺾인 직선들을 더하면 복잡한 곡선도 정교하게 근사할 수 있습니다. 참고로 논문은 ReLU를 썼고, BERT나 GPT는 매끄러운 버전인 GELU를 씁니다." },
  { st: 6, t: "Add &amp; Norm ② + Stack × N",
    b: ["⑥ FFN 출력에도 LayerNorm( z + FFN(z) ) — 두 번째 residual + 정규화",
        "③ MHA → ④ Add&amp;Norm → ⑤ FFN → ⑥ Add&amp;Norm = Encoder Layer 1개",
        "⑦ 같은 구조를 <span class='k'>N = 6</span> 층 쌓기 (가중치는 층마다 다름)",
        "인코더 최종 출력 (3 × 512) → 디코더 attention 의 <span class='k'>K</span>, <span class='v'>V</span>",
        "층별 역할(하위: 구문, 상위: 의미)은 후속 분석 연구의 경향 — 논문 주장은 아님"],
    n: "6단계는 FFN 결과에 다시 입력을 더하고 LayerNorm을 거치는 두 번째 Add & Norm입니다. 여기까지가 인코더 레이어 하나이고, 7단계에서 이 레이어를 6개 쌓습니다. 구조는 같지만 층마다 가중치는 따로 학습됩니다. 층이 깊어질수록 가까운 단어 관계에서 넓은 문맥과 의미로 표현이 발전한다는 해석이 많은데, 이건 이후 분석 연구들에서 관찰된 경향이고 이 논문이 직접 주장한 내용은 아닙니다. 6층을 지난 Allen, walks, dog의 512차원 벡터 3개는 디코더가 참고하는 Key와 Value가 됩니다." },
  { st: 8, t: "디코더: Transformer 안의 3가지 Attention",
    b: ["Encoder self-attention: Q·K·V 모두 인코더, 양방향",
        "Decoder masked self-attention: 이전 위치만 참조",
        "Encoder-Decoder attention: <span class='q'>Q</span> = 디코더, <span class='k'>K</span>·<span class='v'>V</span> = 인코더 출력",
        "모두 같은 Multi-Head Attention 블록"],
    n: "Transformer 안에서 multi-head attention은 세 가지로 쓰입니다. 인코더의 self-attention은 입력 문장의 모든 위치를 서로 참조하고, 디코더의 self-attention은 masking으로 이전 위치만 봅니다. 마지막으로 encoder-decoder attention은 디코더가 Query를 내고 인코더 출력을 Key와 Value로 써서, 번역할 때 원문의 어디를 볼지 정합니다." },
  { st: 8, t: "Output: Linear + Softmax",
    b: ["디코더 마지막 위치 벡터 (512) → Linear (512 → 어휘 ≈ 37,000) → Softmax",
        "Linear 가중치 = 임베딩 행렬과 공유",
        "가장 그럴듯한 토큰을 출력에 붙여 다시 입력 (자기회귀), &lt;/s&gt; 까지 반복",
        "논문: beam search (beam 4, length penalty α = 0.6) · 확률 값은 예시",

const $ = (s) => document.querySelector(s);
const root = $("#slides");
const N = SLIDES.length;
const pad = (i) => String(i).padStart(2, "0");
const status = SLIDES.map(() => "pending");   // pending | loaded | playing | ended | error

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.full ? " full" : "");
  const src = `media/slides/s${pad(i + 1)}.mp4`;
  el.innerHTML = `
    <h1><span class="no">${pad(i + 1)}</span><span>${s.t}</span>${s.st ? `<span class="steps" title="8단계 중 ${s.st}단계">${
      [1,2,3,4,5,6,7,8].map((k) => `<i class="${k === s.st || (s.st === 6 && k === 7) ? "on" : k < s.st ? "done" : ""}">${k}</i>`).join("")}</span>` : ""}</h1>
    <div class="body">
      <div class="vid">
        <video muted playsinline preload="${i < 2 ? "auto" : "metadata"}" src="${src}"></video>
        <div class="missing">영상을 불러오지 못했습니다<br><code>${src}</code><br>
          <span style="font-size:.9em">python transformer_ppt.py 로 렌더링하세요</span></div>
      </div>
      <ul class="pts">${s.b.map((x) => `<li>${x}</li>`).join("")}</ul>
    </div>`;
  const v = el.querySelector("video");
  const box = el.querySelector(".vid");
  v.addEventListener("loadeddata", () => { if (status[i] === "pending") status[i] = "loaded"; });
  v.addEventListener("playing", () => { status[i] = "playing"; });
  v.addEventListener("ended", () => { status[i] = "ended"; });   // 끝나면 마지막 프레임 유지 (loop 없음)
  v.addEventListener("error", () => { status[i] = "error"; box.classList.add("error"); });
  root.appendChild(el);
});

let cur = 0;
let swipeStartX = 0;
let swipeStartY = 0;
let swipeTracking = false;
const SWIPE_THRESHOLD = 48;

function show(i) {
  i = Math.max(0, Math.min(N - 1, i));
  const els = root.children;
  els[cur].classList.remove("active");
  els[cur].querySelector("video").pause();
  cur = i;
  const el = els[cur];
  el.classList.add("active");
  const v = el.querySelector("video");
  if (!el.querySelector(".vid").classList.contains("error")) {
    try { v.currentTime = 0; } catch (e) {}
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  }
  // 다음 슬라이드 미리 로드
  if (cur + 1 < N) els[cur + 1].querySelector("video").preload = "auto";
  $("#notes-text").textContent = SLIDES[cur].n;
  $("#page").textContent = `${cur + 1} / ${N}`;
  $("#bar > div").style.width = `${((cur + 1) / N) * 100}%`;
  if (location.hash !== `#${cur + 1}`) history.replaceState(null, "", `#${cur + 1}`);
}

function startSwipe(e) {
  if (!e.isPrimary || (e.pointerType && e.pointerType !== "touch" && e.pointerType !== "pen")) {
    swipeTracking = false;
    return;
  }
  swipeStartX = e.clientX;
  swipeStartY = e.clientY;
  swipeTracking = true;
  if (e.currentTarget.setPointerCapture) {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
  }
}

function endSwipe(e) {
  if (!swipeTracking) return;
  swipeTracking = false;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) <= Math.abs(dy)) return;
  show(cur + (dx < 0 ? 1 : -1));
}

$("#stage").addEventListener("pointerdown", startSwipe);
$("#stage").addEventListener("pointerup", endSwipe);
$("#stage").addEventListener("pointercancel", () => { swipeTracking = false; });

document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); show(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); show(cur - 1); }
  else if (k === "Home") show(0);
  else if (k === "End") show(N - 1);
  else if (k === "s" || k === "S") $("#notes").classList.toggle("open");
  else if (k === "r" || k === "R") show(cur);
  else if (k === "f" || k === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});
window.addEventListener("hashchange", () => {
  const n = parseInt(location.hash.slice(1), 10);
  if (n && n - 1 !== cur) show(n - 1);
});

const start = parseInt(location.hash.slice(1), 10);
root.children[0].classList.add("active");
show(start ? start - 1 : 0);

/* ?autotest : 모든 슬라이드를 차례로 띄우며 영상 로드/재생 여부를 검사하고
   결과를 <pre id="autotest"> 와 document.title 에 기록한다 (헤드리스 검증용). */
if (new URLSearchParams(location.search).has("autotest")) {
  const out = document.createElement("pre");
  out.id = "autotest";
  out.style.cssText = "position:fixed;top:0;left:0;z-index:9;color:#0f0;background:#000;font-size:12px;margin:0";
  document.body.appendChild(out);
  const result = [];
  (async () => {
    for (let i = 0; i < N; i++) {
      show(i);
      const v = root.children[i].querySelector("video");
      v.preload = "auto";
      const t0 = performance.now();
      while (performance.now() - t0 < 8000) {
        if (status[i] === "error") break;
        if (v.readyState >= 2 && v.currentTime > 0.2) break;
        await new Promise((r) => setTimeout(r, 100));
      }
      const ok = status[i] !== "error" && v.readyState >= 2 && v.currentTime > 0.2;
      result.push({ slide: i + 1, ok, status: status[i], duration: +(v.duration || 0).toFixed(2),
                    played: +v.currentTime.toFixed(2), w: v.videoWidth, h: v.videoHeight,
                    err: v.error ? v.error.code : null });
    }
    const fails = result.filter((r) => !r.ok).map((r) => r.slide);
    out.textContent = "AUTOTEST " + JSON.stringify({ total: N, fails, result });
    document.title = "AUTOTEST_DONE fails=" + fails.join(",");
  })();
}
</script>
</body>
